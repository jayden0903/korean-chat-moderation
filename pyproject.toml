[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kcm"
version = "0.5.0"
description = "Korean game-chat moderation: rules with evidence, a context model, and a local LLM for uncertain lines"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
model = ["torch>=2.1", "transformers>=4.40"]

[project.scripts]
kcm-judge = "kcm.cli:main"

[tool.setuptools]
packages = ["kcm"]
